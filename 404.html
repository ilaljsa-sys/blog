              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <span class="hidden sm:inline font-bold whitespace-nowrap">Kamus Pintar</span>

    <span class="text-7xl font-black text-sky-500 tracking-wider">404</span>

    <a href="/"

  <footer class="border-t border-slate-200 dark:border-slate-900 py-6 px-6 text-center text-xs text-slate-400">
