<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Masking Reveal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f1115;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    /* Container kartu foto */
    .photo-wrapper {
      position: relative;
      width: 420px;
      max-width: 90vw;
      aspect-ratio: 3 / 4;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      cursor: crosshair;
      user-select: none;
    }

    /* Foto dasar (layer paling bawah) */
    .photo-base {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 1;
    }

    /* Canvas untuk Spider-Man + Masking brush (layer atas) */
    #revealCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div class="photo-wrapper" id="cardWrapper">
    <img 
      class="photo-base" 
      id="baseImg" 
      src="foto-asli.jpg" 
      alt="Base Photo"
    />

    <canvas id="revealCanvas"></canvas>
  </div>

  <script>
    const wrapper = document.getElementById('cardWrapper');
    const canvas = document.getElementById('revealCanvas');
    const ctx = canvas.getContext('2d');

    // Load gambar Spider-Man (Layer reveal)
    const spideyImg = new Image();
    spideyImg.src = 'foto-spiderman.jpg'; // <-- Ganti dengan path foto Spider-Man kamu

    // Konfigurasi state interaksi
    let isHovering = false;
    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;

    // Pengaturan radius brush
    const HOVER_RADIUS = 130;  // Ukuran lubang intip saat mouse digerakkan
    const IDLE_MIN_R = 70;     // Radius minimal saat berdenyut otomatis
    const IDLE_MAX_R = 110;    // Radius maksimal saat berdenyut otomatis
    let currentRadius = 0;
    let targetRadius = 0;

    // Sinkronisasi resolusi internal canvas dengan ukuran pixel aslinya di layar
    function resizeCanvas() {
      const rect = wrapper.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      // Posisi default awal di tengah kartu
      if (!isHovering && currentX === 0) {
        currentX = targetX = rect.width / 2;
        currentY = targetY = rect.height / 2;
        currentRadius = targetRadius = IDLE_MIN_R;
      }
    }

    window.addEventListener('resize', resizeCanvas);

    // Event listener kursor mouse / pointer
    wrapper.addEventListener('pointerenter', (e) => {
      isHovering = true;
      const rect = wrapper.getBoundingClientRect();
      targetX = e.clientX - rect.left;
      targetY = e.clientY - rect.top;
    });

    wrapper.addEventListener('pointermove', (e) => {
      const rect = wrapper.getBoundingClientRect();
      targetX = e.clientX - rect.left;
      targetY = e.clientY - rect.top;
    });

    wrapper.addEventListener('pointerleave', () => {
      isHovering = false;
      const rect = wrapper.getBoundingClientRect();
      // Saat pointer keluar, arahkan kursor kembali santai ke tengah
      targetX = rect.width / 2;
      targetY = rect.height / 2;
    });

    // Helper untuk merender gambar dengan teknik object-fit: cover di canvas
    function drawCoverImage(img, width, height) {
      const imgRatio = img.width / img.height;
      const canvasRatio = width / height;
      let drawW, drawH, drawX, drawY;

      if (imgRatio > canvasRatio) {
        drawH = height;
        drawW = height * imgRatio;
        drawX = (width - drawW) / 2;
        drawY = 0;
      } else {
        drawW = width;
        drawH = width / imgRatio;
        drawX = 0;
        drawY = (height - drawH) / 2;
      }

      ctx.drawImage(img, drawX, drawY, drawW, drawH);
    }

    // Loop animasi 60 FPS menggunakan requestAnimationFrame
    function render(time) {
      const rect = wrapper.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      // Bersihkan canvas setiap frame
      ctx.clearRect(0, 0, w, h);

      if (spideyImg.complete && spideyImg.naturalWidth > 0 && w > 0 && h > 0) {
        
        // Perhitungan pergerakan posisi (LERP untuk pergerakan halus tanpa hentakan)
        const lerpFactor = isHovering ? 0.18 : 0.05;
        currentX += (targetX - currentX) * lerpFactor;
        currentY += (targetY - currentY) * lerpFactor;

        // Hitung radius: denyutan otomatis (idle) vs kursor aktif (hover)
        if (isHovering) {
          targetRadius = HOVER_RADIUS;
        } else {
          // Efek sinus untuk nafas/breathing halus
          const pulse = (Math.sin(time * 0.003) + 1) / 2;
          targetRadius = IDLE_MIN_R + pulse * (IDLE_MAX_R - IDLE_MIN_R);
        }
        currentRadius += (targetRadius - currentRadius) * 0.1;

        // 1. Gambar foto Spider-Man secara penuh di canvas
        ctx.save();
        drawCoverImage(spideyImg, w, h);

        // 2. Kunci inti: 'destination-in' memotong gambar hanya di area kuas gradien
        ctx.globalCompositeOperation = 'destination-in';

        // Buat lingkaran kuas dengan pinggiran feathering lembut
        const gradient = ctx.createRadialGradient(
          currentX, currentY, Math.max(0, currentRadius * 0.25),
          currentX, currentY, currentRadius
        );
        gradient.addColorStop(0, 'rgba(0, 0, 0, 1)');      // Solid di tengah
        gradient.addColorStop(0.7, 'rgba(0, 0, 0, 0.85)'); // Gradasi lembut
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');       // Tembus pandang di tepi

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(currentX, currentY, currentRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    // Inisialisasi awal setelah resource siap
    spideyImg.onload = () => {
      resizeCanvas();
      requestAnimationFrame(render);
    };

    // Cadangan trigger jika gambar sudah dalam cache
    if (spideyImg.complete) {
      resizeCanvas();
      requestAnimationFrame(render);
    }
  </script>
</body>
</html>
