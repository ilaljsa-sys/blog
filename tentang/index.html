  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="bg-neutralDark text-slate-100 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white bg-dots-dark text-base antialiased pb-28 md:pb-0" id="body-root">

  <nav class="sticky top-0 z-50 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 bg-white/85 dark:bg-neutralDark/85 px-6 py-4">

          ilal<span class="text-sky-500 font-black">jsa</span>

          </svg>
          <span class="hidden sm:inline font-bold whitespace-nowrap">Kamus Pintar</span>
        </button>

        <button onclick="toggleTheme()" class="w-11 h-11 rounded-2xl flex items-center justify-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm shrink-0">

    <div class="bg-white dark:bg-cardDark border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-md p-6 sm:p-7 space-y-5 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-black text-slate-900 dark:text-white">Kirim Pesan Anonim</h3>
        <button onclick="tutupModalAnon()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold">✕</button>
      </div>
      <textarea id="anon-pesan-input" rows="4" placeholder="Tulis pesan rahasia di sini..." class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-sm focus:outline-none focus:border-sky-500 resize-none text-slate-900 dark:text-white"></textarea>
      <div id="anon-status" class="text-xs font-bold text-center hidden"></div>
      <button onclick="kirimPesanAnonim()" class="w-full py-3.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-white font-extrabold text-sm transition">Kirim Pesan Rahasia</button>
